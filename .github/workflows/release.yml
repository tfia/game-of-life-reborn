name: Release extension

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read manifest version
        id: version
        run: echo "version=$(node -p "require('./src/manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Verify release tag matches manifest
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: test "$TAG" = "v$VERSION"
      - run: npm test
      - run: ./build.sh
      - name: Install Chromium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Build CRX
        run: |
          chrome --headless --no-sandbox --disable-gpu --pack-extension="$PWD/dist"
          test -f dist.crx
          mv dist.crx "dist/game-of-life-${{ steps.version.outputs.version }}.crx"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Game of Life ${{ steps.version.outputs.version }}
          files: |
            dist/game-of-life-${{ steps.version.outputs.version }}.crx
            dist/game-of-life.zip
