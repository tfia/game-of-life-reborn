name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: ./build.sh
      - name: Verify packaged manifest
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/manifest.json'));if(m.version!=='1.3.7'||m.manifest_version!==3)process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: game-of-life-extension
          path: dist/game-of-life.zip
